name: Import OfferGuard source

on:
  push:
    branches: [main]
    paths:
      - OfferGuard-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand verified source archive
        shell: bash
        run: |
          test -f OfferGuard-source.zip || exit 0
          unzip -o OfferGuard-source.zip
          rm -f OfferGuard-source.zip .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import OfferGuard source"
          git push
